name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyyaml

      - name: Run Ruff Linting
        run: |
          ruff check . || true

      - name: Run Secret Scanning with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SKILL.md Frontmatter and Naming
        run: |
          python - << 'EOF'
          import os, sys, re, yaml

          skills_dir = "skills"
          if not os.path.exists(skills_dir):
              print("No skills directory found, skipping.")
              sys.exit(0)

          errors = []
          name_pattern = re.compile(r"^[a-z0-9]+(-[a-z0-9]+)*$")

          for entry in os.scandir(skills_dir):
              if entry.is_dir():
                  skill_file = os.path.join(entry.path, "SKILL.md")
                  if not os.path.isfile(skill_file):
                      errors.append(f"Missing SKILL.md in {entry.path}")
                      continue

                  with open(skill_file, "r", encoding="utf-8") as f:
                      content = f.read()

                  if not content.startswith("---"):
                      errors.append(f"{skill_file} missing YAML frontmatter opening '---'")
                      continue

                  parts = content.split("---", 2)
                  if len(parts) < 3:
                      errors.append(f"{skill_file} malformed YAML frontmatter")
                      continue

                  try:
                      meta = yaml.safe_load(parts[1])
                  except Exception as e:
                      errors.append(f"{skill_file} YAML parse error: {e}")
                      continue

                  name = meta.get("name")
                  desc = meta.get("description")

                  if not name or not name_pattern.match(name) or len(name) > 64:
                      errors.append(f"{skill_file}: invalid 'name' field")

                  if name != entry.name:
                      errors.append(f"{skill_file}: name '{name}' does not match directory '{entry.name}'")

                  if not desc or len(desc) < 1 or len(desc) > 1024:
                      errors.append(f"{skill_file}: description must be between 1 and 1024 characters")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("All skills passed frontmatter validation.")
          EOF

      - name: Validate Obsidian Second Brain Links and Structure
        run: |
          python - << 'EOF'
          import os, sys

          brain_dir = "brain"
          if not os.path.exists(brain_dir):
              print("No brain directory found.")
              sys.exit(1)

          required_folders = ["inbox", "projects", "areas", "resources", "archive"]
          missing = [f for f in required_folders if not os.path.isdir(os.path.join(brain_dir, f))]
          if missing:
              print(f"Missing required PARA folders: {missing}")
              sys.exit(1)

          if not os.path.isfile(os.path.join(brain_dir, "index.md")):
              print("Missing brain/index.md entry point")
              sys.exit(1)

          if not os.path.isfile(os.path.join(brain_dir, "log.md")):
              print("Missing brain/log.md entry point")
              sys.exit(1)

          print("Second Brain PARA structure and entry points validated successfully.")
          EOF

