name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      YT_INTEL_PROVIDER: fixture

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Scanning with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: python -m pip install '.[dev]'

      - name: Check lint and formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Check types
        run: mypy src

      - name: Run fixture tests and enforce coverage
        run: pytest -m "not live" --cov=yt_intel_mcp --cov-fail-under=85

      - name: Validate skills
        run: python scripts/validate_skills.py

      - name: Validate Second Brain
        run: python scripts/validate_brain.py
