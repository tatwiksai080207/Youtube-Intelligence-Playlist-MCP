# Accepted toolchain (SRS Section 2.3, ADR-0001, D-02): Python 3.11+ with the official MCP SDK.
# JSON Schemas reside in src/yt_intel_mcp/schemas/ per ADR-0001 (conflict C-02).

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "yt-intel-mcp"
version = "0.1.0"
description = "YouTube Video Intelligence MCP Server: metadata-based discovery and constrained playlist curation over the YouTube Data API v3."
readme = "AGENTS.md"
requires-python = ">=3.11"
license = { text = "Proprietary - IIIT Bangalore SE Lab coursework" }
authors = [
    { name = "Molleti Tatwik Sai" },
    { name = "Madire Shiva Reddy" },
    { name = "Mohammed Farhan" },
]
dependencies = [
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",
    "types-PyYAML",
]

[project.scripts]
yt-intel-mcp = "yt_intel_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_intel_mcp"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: hits the real YouTube Data API; excluded from PR CI (TQ-5)",
]

[tool.coverage.run]
source = ["yt_intel_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["agent_code"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
